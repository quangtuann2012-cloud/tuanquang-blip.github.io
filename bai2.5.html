<!doctype html>
<html lang="vi" data-bs-theme="light">
    <head>
        <title>Bài 2.5 - Màu nền theo ngữ cảnh</title>

        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <style>
            .mau-nen {
                padding: 8px 10px;
                margin-bottom: 10px;
            }
        </style>
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>

        <main class="container mt-5">

            <h2>Màu nền theo ngữ cảnh</h2>

            <p>Sử dụng các class màu nền theo ngữ cảnh:</p>

            <!-- Primary -->
            <div class="mau-nen bg-primary text-white">
                Văn bản quan trọng.
            </div>

            <!-- Success -->
            <div class="mau-nen bg-success text-white">
                Văn bản chỉ ra sự thành công.
            </div>

            <!-- Info -->
            <div class="mau-nen bg-info text-dark">
                Văn bản chứa thông tin.
            </div>

            <!-- Warning -->
            <div class="mau-nen bg-warning text-dark">
                Văn bản này là cảnh báo.
            </div>

            <!-- Danger -->
            <div class="mau-nen bg-danger text-white">
                Văn bản thông báo sự nguy hiểm.
            </div>

            <!-- Secondary -->
            <div class="mau-nen bg-secondary text-white">
                Màu nền phụ.
            </div>

            <!-- Dark -->
            <div class="mau-nen bg-dark text-white">
                Màu nền xám đen.
            </div>

            <!-- Light -->
            <div class="mau-nen bg-light text-dark">
                Màu nền xám trắng.
            </div>

        </main>

        <footer>
            <!-- place footer here -->
        </footer>

        <!-- Bootstrap JavaScript Bundle -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
