<!doctype html>
<html lang="vi">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Bài 4.4 - Dynamic Tabs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">Tài chính</h2>

    <!-- Nav Tabs -->

    <ul class="nav nav-tabs">

        <li class="nav-item">

            <button class="nav-link active"
                    data-bs-toggle="tab"
                    data-bs-target="#trangchu">

                Trang chủ

            </button>

        </li>

        <li class="nav-item">

            <button class="nav-link"
                    data-bs-toggle="tab"
                    data-bs-target="#kinhdoanh">

                Kinh doanh

            </button>

        </li>

        <li class="nav-item">

            <button class="nav-link"
                    data-bs-toggle="tab"
                    data-bs-target="#congnghe">

                Công nghệ

            </button>

        </li>

    </ul>


    <!-- Nội dung -->

    <div class="tab-content border p-4">

        <div class="tab-pane fade show active"
             id="trangchu">

            <h3>Trang chủ</h3>

            <p>
                Giá vàng hôm nay biến động,
                thị trường tài chính có nhiều thay đổi.
            </p>

        </div>


        <div class="tab-pane fade"
             id="kinhdoanh">

            <h3>Kinh doanh</h3>

            <p>
                Thông tin mới nhất về doanh nghiệp,
                thị trường và hoạt động kinh doanh.
            </p>

        </div>


        <div class="tab-pane fade"
             id="congnghe">

            <h3>Công nghệ</h3>

            <p>
                Cập nhật các xu hướng công nghệ,
                sản phẩm và giải pháp mới.
            </p>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
