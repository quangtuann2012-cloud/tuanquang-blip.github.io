<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bài 4.2 - Nav Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">Bài 4.2 - Các kiểu Nav trong Bootstrap</h2>

    <!-- Nav Tabs -->
    <h4>1. Nav Tabs</h4>

    <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">Profile</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">Messages</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">Reports</a>
        </li>
    </ul>


    <!-- Nav Pills -->
    <h4>2. Nav Pills</h4>

    <ul class="nav nav-pills mb-4">
        <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">Profile</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">Messages</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">Reports</a>
        </li>
    </ul>


    <!-- Nav dọc -->
    <h4>3. Nav theo chiều dọc</h4>

    <ul class="nav nav-pills flex-column mb-4"
        style="width: 200px;">

        <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">Profile</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">Messages</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">Reports</a>
        </li>
    </ul>


    <!-- Nav căn đều -->
    <h4>4. Nav Justified</h4>

    <ul class="nav nav-pills nav-justified mb-4">

        <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">Profile</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">Messages</a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">Reports</a>
        </li>

    </ul>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
