<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 3.1 - Bootstrap Button</title>

        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>

        <header>
            <!-- place navbar here -->
        </header>

        <main class="container mt-4">

            <!-- ========================= -->
            <!-- BÀI 3.1 -->
            <!-- ========================= -->

            <h5>Bài 3.1: Tạo các Buttons theo mẫu:</h5>


            <!-- ========================= -->
            <!-- A. ĐỊNH NGHĨA CLASS BUTTON -->
            <!-- ========================= -->

            <p class="mt-3">a)</p>

            <h3>Định nghĩa các class buttons</h3>

            <button type="button" class="btn btn-light border">
                Default Button
            </button>

            <button type="button" class="btn btn-primary">
                Primary Button
            </button>

            <button type="button" class="btn btn-success">
                Success Button
            </button>

            <button type="button" class="btn btn-info">
                Info Button
            </button>

            <button type="button" class="btn btn-warning">
                Warning Button
            </button>

            <button type="button" class="btn btn-danger">
                Danger Button
            </button>

            <button type="button" class="btn btn-link">
                Link Button
            </button>


            <!-- ========================= -->
            <!-- B. BUTTON ĐƯỜNG VIỀN -->
            <!-- ========================= -->

            <p class="mt-4">b)</p>

            <h3>Button với đường viền</h3>

            <button type="button" class="btn btn-outline-primary">
                Primary
            </button>

            <button type="button" class="btn btn-outline-secondary">
                Secondary
            </button>

            <button type="button" class="btn btn-outline-success">
                Success
            </button>

            <button type="button" class="btn btn-outline-info">
                Info
            </button>

            <button type="button" class="btn btn-outline-warning">
                Warning
            </button>

            <button type="button" class="btn btn-outline-danger">
                Danger
            </button>

            <button type="button" class="btn btn-outline-dark">
                Dark
            </button>

            <button type="button" class="btn btn-outline-light text-dark">
                Light
            </button>


            <!-- ========================= -->
            <!-- C. KÍCH THƯỚC BUTTON -->
            <!-- ========================= -->

            <p class="mt-4">c)</p>

            <h3>Kích thước của button</h3>

            <!-- Button lớn -->
            <button type="button" class="btn btn-dark btn-lg">
                Nút to
            </button>

            <!-- Button mặc định -->
            <button type="button" class="btn btn-dark">
                Kích thước mặc định
            </button>

            <!-- Button nhỏ -->
            <button type="button" class="btn btn-dark btn-sm">
                Nút nhỏ
            </button>


            <!-- ========================= -->
            <!-- D. THÀNH PHẦN BUTTON -->
            <!-- ========================= -->

            <p class="mt-4">d)</p>

            <h3>Thành phần của Button</h3>

            <!-- Thẻ a -->
            <a href="#" class="btn btn-dark" role="button">
                Button chứa link
            </a>

            <!-- Thẻ button -->
            <button type="button" class="btn btn-dark">
                Button
            </button>

            <!-- Input Button -->
            <input
                type="button"
                class="btn btn-dark"
                value="Input Button"
            />

            <!-- Submit Button -->
            <input
                type="submit"
                class="btn btn-dark"
                value="Submit Button"
            />


            <!-- ========================= -->
            <!-- E. TRẠNG THÁI BUTTON -->
            <!-- ========================= -->

            <p class="mt-4">e)</p>

            <h3>Trạng thái của nút</h3>

            <!-- Nút bình thường -->
            <button type="button" class="btn btn-dark">
                Nút bình thường
            </button>

            <!-- Nút có thể click -->
            <button type="button" class="btn btn-dark">
                Nút có thể click
            </button>

            <!-- Nút không thể click -->
            <button type="button" class="btn btn-dark" disabled>
                Nút không thể click
            </button>

            <!-- Link không thể click -->
            <a
                href="#"
                class="btn btn-dark disabled"
                tabindex="-1"
                aria-disabled="true"
            >
                Link không thể click
            </a>


            <!-- ========================= -->
            <!-- F. BUTTON LOADING -->
            <!-- ========================= -->

            <p class="mt-4">f)</p>

            <h3>Nút đang load</h3>

            <p>Thêm trạng thái đang load cho nút:</p>


            <!-- Chỉ có icon loading -->
            <button class="btn btn-dark" type="button" disabled>
                <span
                    class="spinner-border spinner-border-sm"
                    aria-hidden="true"
                ></span>

                <span class="visually-hidden">Loading...</span>
            </button>


            <!-- Loading có chữ -->
            <button class="btn btn-dark" type="button" disabled>
                <span
                    class="spinner-border spinner-border-sm"
                    aria-hidden="true"
                ></span>

                Loading...
            </button>


            <!-- Loading màu Secondary -->
            <button class="btn btn-secondary" type="button" disabled>
                <span
                    class="spinner-border spinner-border-sm"
                    aria-hidden="true"
                ></span>

                Loading...
            </button>


            <!-- Loading không spinner -->
            <button class="btn btn-secondary" type="button" disabled>
                Loading...
            </button>

        </main>


        <footer>
            <!-- place footer here -->
        </footer>


        <!-- Bootstrap JavaScript Bundle -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

    </body>
</html>
