<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 3.4 - Form đăng nhập</title>

        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>

        <header>
            <!-- place navbar here -->
        </header>

        <main class="container mt-4">

            <h5>Bài 3.4: Tạo form đăng nhập theo mẫu</h5>


            <!-- ========================= -->
            <!-- PHẦN A -->
            <!-- ========================= -->

            <p class="mt-3">a)</p>

            <form>

                <!-- Email -->
                <div class="row mb-3 align-items-center">

                    <label
                        for="email"
                        class="col-sm-2 col-form-label"
                    >
                        Email
                    </label>

                    <div class="col-sm-10">

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Email"
                        />

                    </div>

                </div>


                <!-- Password -->
                <div class="row mb-3 align-items-center">

                    <label
                        for="password"
                        class="col-sm-2 col-form-label"
                    >
                        Password
                    </label>

                    <div class="col-sm-10">

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Password"
                        />

                    </div>

                </div>


                <!-- Remember me -->
                <div class="row mb-3">

                    <div class="offset-sm-2 col-sm-10">

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="remember"
                            />

                            <label
                                class="form-check-label"
                                for="remember"
                            >
                                Remember me
                            </label>

                        </div>

                    </div>

                </div>


                <!-- Sign in -->
                <div class="row">

                    <div class="offset-sm-2 col-sm-10">

                        <button
                            type="submit"
                            class="btn btn-dark"
                        >
                            Sign in
                        </button>

                    </div>

                </div>

            </form>


            <!-- ========================= -->
            <!-- PHẦN B -->
            <!-- ========================= -->

            <p class="mt-5">b)</p>

            <h3>Textarea</h3>

            <p>
                Dùng class .form-control để tạo kiểu cho vùng nhập văn bản
            </p>


            <form>

                <!-- Bình luận -->
                <div class="mb-3">

                    <label
                        for="binhluan"
                        class="form-label"
                    >
                        Bình luận:
                    </label>

                    <textarea
                        class="form-control"
                        id="binhluan"
                        rows="4"
                    ></textarea>

                </div>


                <!-- Nút gửi -->
                <button
                    type="submit"
                    class="btn btn-dark"
                >
                    Gửi
                </button>

            </form>

        </main>


        <footer>
            <!-- place footer here -->
        </footer>


        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

    </body>
</html>
